run:
  tests: true

linters-settings:
  funlen:
    lines: 150
    statements: 80
  tagliatelle:
    case:
      rules:
        json: snake
  depguard:
    rules:
      main:
        allow:
          - github.com/ihomyak/otus_project
          - io
          - os
          - fmt
          - log
          - time
          - bytes
          - errors
          - strings
          - regexp
          - strconv
          - syscall
          - testing
          - context
          - net/http
          - sync/atomic
          - database/sql
          - encoding/json
          - github.com/jmoiron/sqlx
          - github.com/lib/pq
          - github.com/spf13/viper
          - github.com/prometheus/client_golang
          - github.com/redis/go-redis/v9


linters:
  disable-all: true
  enable:
    - asciicheck
    - depguard
    - dogsled
    - dupl
    - bodyclose
    - durationcheck
    - errorlint
    - exhaustive
    - exportloopref
    - funlen
    - gci
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gofmt
    - gofumpt
    - goheader
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - stylecheck
    - tagliatelle
    - thelper
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace
